name: animal_mandi
description: "India's Animal Marketplace — Online 24/7"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter

  riverpod: ^2.4.0
  flutter_riverpod: ^2.4.0
  go_router: ^12.0.0
  dio: ^5.3.0
  shared_preferences: ^2.2.0
  hive: ^2.2.0
  hive_flutter: ^1.1.0
  firebase_core: ^2.24.0
  firebase_messaging: ^14.7.0
  firebase_analytics: ^10.7.0
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0
  geocoding: ^2.1.0
  image_picker: ^1.0.0
  cached_network_image: ^3.3.0
  photo_view: ^0.14.0
  flutter_svg: ^2.0.0
  smooth_page_indicator: ^1.1.0
  dotted_border: ^2.1.0
  shimmer: ^3.0.0
  animations: ^2.0.0
  razorpay_flutter: ^1.3.0
  intl: ^0.19.0
  easy_localization: ^3.0.0
  logger: ^2.1.0
  connectivity_plus: ^5.0.0
  timeago: ^3.5.0
  permission_handler: ^11.4.0
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/locales/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
